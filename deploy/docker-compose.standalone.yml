services:
  insightops:
    image: deploy-insightops-app:latest
    restart: unless-stopped
    depends_on:
      insightops-mysql:
        condition: service_started
    environment:
      app_name: ${APP_NAME:-InsightOps}
      app_env: ${APP_ENV:-prod}
      project_db_host: insightops-mysql
      project_db_port: 3306
      project_db_user: ${PROJECT_DB_USER:-insightops}
      project_db_password: ${PROJECT_DB_PASSWORD:-insightops}
      project_db_name: ${PROJECT_DB_NAME:-insightops}
      zabbix_db_host: ${ZABBIX_DB_HOST}
      zabbix_db_port: ${ZABBIX_DB_PORT:-3306}
      zabbix_db_user: ${ZABBIX_DB_USER:-readonly}
      zabbix_db_password: ${ZABBIX_DB_PASSWORD}
      zabbix_db_name: ${ZABBIX_DB_NAME:-zabbix}
    volumes:
      - insightops-uploads-data:/app/backend/uploads
    ports:
      - "${APP_PORT:-8080}:8000"

  insightops-mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${PROJECT_DB_NAME:-insightops}
      MYSQL_USER: ${PROJECT_DB_USER:-insightops}
      MYSQL_PASSWORD: ${PROJECT_DB_PASSWORD:-insightops}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    volumes:
      - insightops-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  insightops-mysql-data:
  insightops-uploads-data:
